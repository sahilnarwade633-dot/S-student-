<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S-Student</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050816;color:#fff;font-family:Arial}
.top{background:linear-gradient(135deg,#0066ff,#00c6ff);padding:25px;border-radius:0 0 25px 25px}
.top h1{font-size:35px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:20px}
.card{background:#111827;border:1px solid #1e90ff;border-radius:18px;padding:25px;text-align:center;font-size:18px}
</style>
</head>
<body>

<div class="top">
<h1>S-Student</h1>
<p>Learn • Plan • Grow</p>
</div>

<div class="grid">
<div class="card">📚 Notes</div>
<div class="card">📊 Attendance</div>
<div class="card">🎓 CGPA</div>
<div class="card">📅 Timetable</div>
<div class="card">✅ To-Do</div>
<div class="card">👤 Profile</div>
</div>

</body>
</html>
